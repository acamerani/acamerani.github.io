<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slot Machine - Cilindro dei Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', 'Courier New', monospace;
            padding: 20px;
        }

        /* Contenitore principale stile casinò */
        .slot-container {
            background: radial-gradient(circle at 30% 20%, #1e2a3a, #0b101a);
            border-radius: 80px 80px 60px 60px;
            padding: 30px 25px 45px 25px;
            box-shadow: 0 30px 35px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.4);
            transition: all 0.2s;
        }

        /* Schermo principale - il cilindro */
        .cylinder {
            background: linear-gradient(135deg, #2c2e3a 0%, #1e1f2b 100%);
            border-radius: 60px;
            padding: 20px 35px;
            margin-bottom: 35px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 0 4px #ffd966, 0 0 0 8px #b8860b;
            border: 2px solid #ffd700;
            transition: all 0.3s ease;
        }

        /* Effetto luce riflessa sul cilindro */
        .cylinder-inner {
            background: radial-gradient(ellipse at 30% 40%, #f9f3d9, #e9e2c7);
            border-radius: 50px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.3), 0 5px 10px rgba(0, 0, 0, 0.2);
            background-image: repeating-linear-gradient(45deg, rgba(255,215,0,0.08) 0px, rgba(255,215,0,0.08) 2px, transparent 2px, transparent 8px);
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .slot-icon {
            font-size: 5rem;
            display: inline-block;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            margin-bottom: 10px;
        }

        .slot-name {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #2c1e0f, #5c3a1a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 5px rgba(255,215,0,0.3);
            font-family: 'Segoe UI', 'Orbitron', monospace;
            word-break: break-word;
        }

        /* display secondario: link correnti */
        .link-preview {
            background: #0c0f17cc;
            backdrop-filter: blur(8px);
            border-radius: 40px;
            margin-top: 15px;
            padding: 10px 20px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid #ffd966;
            color: #ffecb3;
            font-family: monospace;
        }

        .link-preview span {
            color: #ffd966;
            font-weight: bold;
        }

        .url-display {
            font-size: 0.85rem;
            word-break: break-all;
            color: #bbb;
            margin-top: 6px;
        }

        /* Pannello comandi */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 25px 0 20px;
        }

        button {
            background: radial-gradient(circle at 30% 10%, #f5b642, #d48d1a);
            border: none;
            padding: 14px 35px;
            font-size: 1.4rem;
            font-weight: bold;
            font-family: 'Orbitron', monospace;
            color: #241d0a;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.15s linear;
            box-shadow: 0 8px 0 #7a3e0a;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #7a3e0a;
        }

        button:disabled {
            opacity: 0.6;
            transform: translateY(0);
            cursor: not-allowed;
            filter: grayscale(0.1);
            box-shadow: 0 8px 0 #7a3e0a;
        }

        .goto-btn {
            background: radial-gradient(circle at 30% 10%, #27ae60, #1e8449);
            box-shadow: 0 8px 0 #0e4f2a;
            color: #f9efc0;
        }

        .goto-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #0e4f2a;
        }

        /* legenda dei possibili link (ruota) */
        .legend {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50px;
            padding: 15px 15px;
            border-top: 1px solid #ffd966;
            text-align: center;
        }

        .legend-title {
            color: #ffd966;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .badge {
            background: #171e2c;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #ffdd99;
            box-shadow: inset 0 1px 1px rgba(255,255,200,0.2), 0 2px 5px black;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
        }

        /* animazione lampeggio durante spin */
        @keyframes spinFlash {
            0% { text-shadow: 0 0 0px gold; background: #f9eec1; }
            100% { text-shadow: 0 0 8px #ffcc33; background: #fff3d1; }
        }

        .spinning-effect {
            animation: spinFlash 0.08s infinite alternate;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #5a6b7a;
            margin-top: 20px;
        }

        @media (max-width: 580px) {
            .slot-name { font-size: 1.7rem; }
            .slot-icon { font-size: 3rem; }
            .cylinder-inner { padding: 25px 15px; min-height: 170px; }
            button { padding: 10px 20px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<div class="slot-container">
    <!-- Cilindro principale (slot a un rullo) -->
    <div class="cylinder">
        <div class="cylinder-inner" id="cylinderDisplay">
            <div class="slot-icon" id="slotIcon">🎰</div>
            <div class="slot-name" id="slotName">GIRA</div>
        </div>
        <!-- informazioni aggiuntive sul link attivo -->
        <div class="link-preview" id="linkPreviewArea">
            🎲 <span id="currentLinkLabel">Link attuale</span><br>
            <div class="url-display" id="currentUrlPreview">---</div>
        </div>
    </div>

    <!-- Pannello pulsanti -->
    <div class="controls">
        <button id="spinBtn">🎡 SPIN 🎡</button>
        <button id="gotoBtn" class="goto-btn">🔗 VISITA LINK</button>
    </div>

    <!-- Legenda: tutti i possibili link / simboli del cilindro -->
    <div class="legend">
        <div class="legend-title">🎰 RISULTATI PREMIATI 🎰</div>
        <div class="badges" id="badgesList"></div>
    </div>
    <footer>⬅️ Tira il cilindro! Premi SPIN → ottieni un link → VISITA</footer>
</div>

<script>
    // --------------------------------------------------------------
    // DATI DELLA SLOT: array di link (simboli + nome + url)
    // --------------------------------------------------------------
    const items = [
        { name: "Google", url: "https://www.google.com", icon: "🔍" },
        { name: "YouTube", url: "https://www.youtube.com", icon: "▶️" },
        { name: "GitHub", url: "https://github.com", icon: "🐙" },
        { name: "Wikipedia", url: "https://www.wikipedia.org", icon: "🌐" },
        { name: "Reddit", url: "https://www.reddit.com", icon: "🤖" },
        { name: "Amazon", url: "https://www.amazon.com", icon: "🛒" },
        { name: "Netflix", url: "https://www.netflix.com", icon: "🎬" },
        { name: "Twitter", url: "https://twitter.com", icon: "🐦" },
        { name: "Spotify", url: "https://www.spotify.com", icon: "🎧" },
        { name: "Twitch", url: "https://www.twitch.tv", icon: "📺" }
    ];

    // Stato interno
    let currentItemIndex = null;     // indice selezionato attualmente
    let spinning = false;            // flag rotazione
    let spinInterval = null;
    let spinCounter = 0;
    const SPIN_STEPS = 28;           // numero di cambi rapidi durante l'effetto slot
    const SPIN_DELAY_MS = 65;        // velocità di scorrimento (ms)

    // DOM elementi
    const cylinderIconEl = document.getElementById('slotIcon');
    const cylinderNameEl = document.getElementById('slotName');
    const currentLinkLabelSpan = document.getElementById('currentLinkLabel');
    const currentUrlPreviewDiv = document.getElementById('currentUrlPreview');
    const spinBtn = document.getElementById('spinBtn');
    const gotoBtn = document.getElementById('gotoBtn');
    const badgesContainer = document.getElementById('badgesList');

    // --------------------------------------------------------------
    // FUNZIONE: aggiorna il cilindro con un item specifico (oggetto)
    // --------------------------------------------------------------
    function setCylinderContent(item) {
        if (!item) return;
        cylinderIconEl.textContent = item.icon || '🎲';
        cylinderNameEl.textContent = item.name;
    }

    // --------------------------------------------------------------
    // Aggiorna TUTTA la UI in base all'indice corrente (currentItemIndex)
    // imposta cilindro, preview link, etichetta bottone (testo dinamico)
    // --------------------------------------------------------------
    function updateUIFromCurrent() {
        if (currentItemIndex === null || !items[currentItemIndex]) {
            // fallback (caso non inizializzato)
            if(items.length) currentItemIndex = 0;
            else return;
        }
        const current = items[currentItemIndex];
        // 1) Cilindro principale (icona + nome)
        setCylinderContent(current);
        // 2) Preview testo del link
        currentLinkLabelSpan.textContent = `🔗 ${current.name}`;
        currentUrlPreviewDiv.textContent = current.url;
        // 3) bottone "VISITA LINK" - modifichiamo testo per maggiore chiarezza
        gotoBtn.innerHTML = `🌐 VISITA ${current.name} ➡️`;
        // opzionale: titolo
        gotoBtn.title = `Apri ${current.url}`;
    }

    // --------------------------------------------------------------
    // Funzione temporanea per animazione slot (solo effetto visivo)
    // NON modifica currentItemIndex, solo fa scorrere simboli nel cilindro
    // --------------------------------------------------------------
    function animateSpinStep() {
        // sceglie un elemento casuale dall'array per l'effetto visivo
        const randomTempIndex = Math.floor(Math.random() * items.length);
        const tempItem = items[randomTempIndex];
        setCylinderContent(tempItem);
        // Aggiunge un effetto lampeggiante alla scatola (stile gioco)
        const cylinderInner = document.querySelector('.cylinder-inner');
        cylinderInner.classList.add('spinning-effect');
    }

    // --------------------------------------------------------------
    // Ferma animazione, pulisce timer, ripristina aspetto normale
    // --------------------------------------------------------------
    function stopSpinAnimationAndFinish(finalIndex) {
        if (spinInterval) {
            clearInterval(spinInterval);
            spinInterval = null;
        }
        // Rimuove effetto lampeggiante
        const cylinderInner = document.querySelector('.cylinder-inner');
        cylinderInner.classList.remove('spinning-effect');
        
        // Imposta l'indice finale (vero risultato della slot)
        currentItemIndex = finalIndex;
        // Aggiorna l'interfaccia col risultato reale
        updateUIFromCurrent();
        
        // Riabilita i bottoni (spin e goto)
        spinBtn.disabled = false;
        gotoBtn.disabled = false;
        spinning = false;
    }

    // --------------------------------------------------------------
    // Avvia la slot machine: rotazione a una sola colonna, dopo N step
    // si ferma su un link casuale e permette di visitarlo.
    // --------------------------------------------------------------
    function startSpin() {
        if (spinning) return;          // già in rotazione
        
        spinning = true;
        spinCounter = 0;
        
        // Disabilita i pulsanti durante lo spin (impedisce click multipli e apertura anticipata)
        spinBtn.disabled = true;
        gotoBtn.disabled = true;
        
        // pulisce eventuali animazioni residue
        if (spinInterval) clearInterval(spinInterval);
        
        // Rimuove eventuale effetto luce precedente
        const cylinderInner = document.querySelector('.cylinder-inner');
        cylinderInner.classList.remove('spinning-effect');
        
        // Avvia l'intervallo per l'animazione (cambio simboli fulmineo)
        spinInterval = setInterval(() => {
            // Effetto di scrolling: mostra un simbolo random (simula rotazione cilindro)
            animateSpinStep();
            spinCounter++;
            
            // Quando raggiungiamo il numero massimo di step, fermiamo la slot
            if (spinCounter >= SPIN_STEPS) {
                clearInterval(spinInterval);
                spinInterval = null;
                
                // Scegli il risultato FINALE in maniera casuale (equa)
                const finalIdx = Math.floor(Math.random() * items.length);
                
                // Rimuovere effetto lampeggiante e impostare risultato vero
                const cylinderInnerLocal = document.querySelector('.cylinder-inner');
                cylinderInnerLocal.classList.remove('spinning-effect');
                
                // Imposta il vincitore corrente e aggiorna UI
                currentItemIndex = finalIdx;
                updateUIFromCurrent();
                
                // Fine rotazione: riabilita pulsanti
                spinBtn.disabled = false;
                gotoBtn.disabled = false;
                spinning = false;
                
                // (opzionale) messaggio di successo stealth
                // pulsante GOTO ora attivo sul nuovo link estratto
            }
        }, SPIN_DELAY_MS);
    }

    // --------------------------------------------------------------
    // Apre il link attualmente selezionato nella slot (currentItemIndex)
    // in una nuova scheda in modo sicuro
    // --------------------------------------------------------------
    function openCurrentLink() {
        if (spinning) {
            // se sta girando, non può aprire (bottone disabilitato comunque, ma sicurezza extra)
            return;
        }
        if (currentItemIndex === null || !items[currentItemIndex]) {
            // se per qualche motivo non c'è indice, imposta primo disponibile
            if(items.length) {
                currentItemIndex = 0;
                updateUIFromCurrent();
            } else {
                alert("Nessun link disponibile");
                return;
            }
        }
        const targetItem = items[currentItemIndex];
        if (targetItem && targetItem.url) {
            // Apri il link in una nuova scheda per non abbandonare la slot
            window.open(targetItem.url, '_blank', 'noopener,noreferrer');
        } else {
            alert("Link non valido");
        }
    }

    // --------------------------------------------------------------
    // Inizializza la slot: carica un risultato random iniziale,
    // carica la legenda sottostante con badge di tutti i link possibili
    // --------------------------------------------------------------
    function initializeSlot() {
        // Seleziona un indice casuale per iniziare (effetto "pronto all'uso")
        const randomStart = Math.floor(Math.random() * items.length);
        currentItemIndex = randomStart;
        updateUIFromCurrent();
        
        // Costruisce la legenda dei simboli / link possibili
        badgesContainer.innerHTML = '';
        items.forEach((item, idx) => {
            const badge = document.createElement('div');
            badge.className = 'badge';
            badge.innerHTML = `${item.icon || '🎲'} ${item.name}`;
            // aggiunge un piccolo tooltip con l'URL
            badge.title = item.url;
            badgesContainer.appendChild(badge);
        });
        
        // Collega i pulsanti agli eventi
        spinBtn.onclick = startSpin;
        gotoBtn.onclick = openCurrentLink;
        
        // Disabilita qualche eventuale effetto residuo
        spinning = false;
        if(spinInterval) clearInterval(spinInterval);
    }

    // --------------------------------------------------------------
    // Avvio totale al caricamento della pagina
    // --------------------------------------------------------------
    initializeSlot();
</script>
</body>
</html>
